# Atualizações semanais das dependências. Cada PR do Dependabot passa pelo CI completo antes do merge na develop.
# Versões major de bibliotecas exigem migração planejada e ficam de fora (issue própria); as menores vêm agrupadas num PR
# por pasta. As ações do GitHub recebem também as majors. No espelho público estes PRs não são mergeados: as
# atualizações entram pelo repositório principal.
version: 2
updates:
  - package-ecosystem: maven
    directory: /src/jobdragonquest-api
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:chore", "stack:backend"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      menores:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /src/jobdragonquest-web
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:chore", "stack:frontend"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      menores:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /src/jobdragonquest-mcp
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:chore", "stack:mcp"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      menores:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: ["type:chore", "scope:devops"]
    commit-message:
      prefix: "chore(ci)"
