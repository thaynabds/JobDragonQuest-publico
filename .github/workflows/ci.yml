# Integração contínua do JobDragonQuest: compila e testa a API, o painel e o servidor MCP em cada push e PR para develop e main.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Permissão mínima: o workflow só lê o código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Java 21, ./mvnw verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/jobdragonquest-api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes, cobertura mínima e build
        run: ./mvnw -B -ntp verify
      - name: Resumo dos testes
        if: always()
        working-directory: .
        run: node scripts/resumo-testes.mjs "API" src/jobdragonquest-api/target/surefire-reports
      - name: Relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-api
          path: |
            src/jobdragonquest-api/target/surefire-reports/
            src/jobdragonquest-api/target/site/jacoco/
          retention-days: 30
          if-no-files-found: warn

  web:
    name: Painel (Node 20, npm run verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/jobdragonquest-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: src/jobdragonquest-web/package-lock.json
      - name: Dependências exatas do lockfile
        run: npm ci --no-audit --no-fund
      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Lint, tipos, testes e build
        run: npm run verify
      - name: Resumo dos testes
        if: always()
        working-directory: .
        run: node scripts/resumo-testes.mjs "Painel" src/jobdragonquest-web/test-results
      - name: Relatório de teste
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-web
          path: src/jobdragonquest-web/test-results/
          retention-days: 30
          if-no-files-found: warn

  mcp:
    name: Servidor MCP (Node 20, npm run verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/jobdragonquest-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: src/jobdragonquest-mcp/package-lock.json
      - name: Dependências exatas do lockfile
        run: npm ci --no-audit --no-fund
      - name: Auditoria das dependências
        run: npm audit --audit-level=high
      - name: Tipos, testes e build
        run: npm run verify
      - name: Resumo dos testes
        if: always()
        working-directory: .
        run: node scripts/resumo-testes.mjs "MCP" src/jobdragonquest-mcp/test-results
      - name: Relatório de teste
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-mcp
          path: src/jobdragonquest-mcp/test-results/
          retention-days: 30
          if-no-files-found: warn

  congo:
    name: Plugin do Congo (Python 3.12, unittest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes do plugin sem rede
        run: python -m unittest discover -s integrations/congo -p 'test_*.py' -v

  dependencias:
    name: Dependências com vulnerabilidade conhecida (OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # O pom.xml sozinho só lista as dependências diretas; o SBOM CycloneDX traz também as transitivas de execução.
      - name: SBOM da API (CycloneDX)
        working-directory: src/jobdragonquest-api
        run: ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DoutputFormat=json -DoutputName=bom.cdx -DincludeTestScope=false
      # Falha com qualquer vulnerabilidade conhecida na API, no painel ou no MCP (inclusive dependências de desenvolvimento).
      # Exceção só em osv-scanner.toml, com motivo e data de validade.
      - name: Análise de dependências
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=src/jobdragonquest-api/target/bom.cdx.json
            --lockfile=src/jobdragonquest-web/package-lock.json
            --lockfile=src/jobdragonquest-mcp/package-lock.json

  commits:
    name: Mensagens de commit (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Conferir os commits do PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verificar/commits.mjs "$BASE..$HEAD"
