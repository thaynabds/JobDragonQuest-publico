# Integração contínua do JobDragonQuest: compila e testa a API, o painel e o servidor MCP em cada push e PR para develop e main.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# O espelho público só recebe main, develop e tags pelo script de publicação; PRs lá (do Dependabot) nunca são mergeados,
# então o CI de pull_request só roda no repositório principal. Os pushes rodam nos dois.

# Permissão mínima: o workflow só lê o código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    if: github.event_name == 'push' || github.repository == 'thaynabds/JobDragonQuest'
    name: API (Java 21, ./mvnw verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/jobdragonquest-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes, cobertura mínima e build
        run: ./mvnw -B -ntp verify
      - name: Resumo dos testes
        if: always()
        working-directory: .
        run: node scripts/resumo-testes.mjs "API" src/jobdragonquest-api/target/surefire-reports
      - name: Relatórios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-api
          path: |
            src/jobdragonquest-api/target/surefire-reports/
            src/jobdragonquest-api/target/site/jacoco/
          retention-days: 30
          if-no-files-found: warn

  web:
    if: github.event_name == 'push' || github.repository == 'thaynabds/JobDragonQuest'
    name: Painel (Node 20, npm run verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/jobdragonquest-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: src/jobdragonquest-web/package-lock.json
      - name: Dependências exatas do lockfile
        run: npm ci --no-audit --no-fund
      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Aviso de versão do widget de acessibilidade
        run: node ../../scripts/verificar/widget-atualizado.mjs
      - name: Lint, tipos, testes e build
        run: npm run verify
      - name: Resumo dos testes
        if: always()
        working-directory: .
        run: node scripts/resumo-testes.mjs "Painel" src/jobdragonquest-web/test-results
      - name: Relatório de teste
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-web
          path: src/jobdragonquest-web/test-results/
          retention-days: 30
          if-no-files-found: warn

  mcp:
    if: github.event_name == 'push' || github.repository == 'thaynabds/JobDragonQuest'
    name: Servidor MCP (Node 20, npm run verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/jobdragonquest-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: src/jobdragonquest-mcp/package-lock.json
      - name: Dependências exatas do lockfile
        run: npm ci --no-audit --no-fund
      - name: Auditoria das dependências
        run: npm audit --audit-level=high
      - name: Tipos, testes e build
        run: npm run verify
      - name: Resumo dos testes
        if: always()
        working-directory: .
        run: node scripts/resumo-testes.mjs "MCP" src/jobdragonquest-mcp/test-results
      - name: Relatório de teste
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-mcp
          path: src/jobdragonquest-mcp/test-results/
          retention-days: 30
          if-no-files-found: warn

  congo:
    if: github.event_name == 'push' || github.repository == 'thaynabds/JobDragonQuest'
    name: Python (Ruff e testes do plugin do Congo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Lint do Python (Ruff)
        run: pip install --no-cache-dir ruff==0.17.1 && ruff check .
      - name: Testes dos scripts e da extensão
        run: node --test scripts/verificar/commits.test.mjs scripts/notas-da-release.test.mjs extensao-navegador/comum.test.mjs
      - name: Testes do plugin sem rede
        run: python -m unittest discover -s integrations/congo -p 'test_*.py' -v

  dependencias:
    if: github.event_name == 'push' || github.repository == 'thaynabds/JobDragonQuest'
    name: Dependências com vulnerabilidade conhecida (OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # O pom.xml sozinho só lista as dependências diretas; o SBOM CycloneDX traz também as transitivas de execução.
      - name: SBOM da API (CycloneDX)
        working-directory: src/jobdragonquest-api
        run: ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DoutputFormat=json -DoutputName=bom.cdx -DincludeTestScope=false
      # Falha com qualquer vulnerabilidade conhecida na API, no painel ou no MCP (inclusive dependências de desenvolvimento).
      # Exceção só em osv-scanner.toml, com motivo e data de validade.
      - name: Análise de dependências
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=src/jobdragonquest-api/target/bom.cdx.json
            --lockfile=src/jobdragonquest-web/package-lock.json
            --lockfile=src/jobdragonquest-mcp/package-lock.json

  commits:
    name: Mensagens de commit (Conventional Commits)
    if: github.event_name == 'pull_request' && github.repository == 'thaynabds/JobDragonQuest'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Conferir os commits do PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verificar/commits.mjs "$BASE..$HEAD"

  e2e:
    name: Ponta a ponta no navegador (Playwright)
    if: github.event_name == 'push' || github.repository == 'thaynabds/JobDragonQuest'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobdragonquest
          POSTGRES_USER: jobdragonquest
          POSTGRES_PASSWORD: senha-so-do-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobdragonquest" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      JOBDRAGONQUEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/jobdragonquest
      JOBDRAGONQUEST_DB_USER: jobdragonquest
      JOBDRAGONQUEST_DB_PASSWORD: senha-so-do-ci
      JOBDRAGONQUEST_SECURE_COOKIES: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: src/jobdragonquest-web/package-lock.json
      - name: Build da API
        working-directory: src/jobdragonquest-api
        run: ./mvnw -B -ntp -DskipTests -Dcheckstyle.skip -Djacoco.skip=true package
      - name: Subir a API (segredo do JWT gerado só para esta execução)
        working-directory: src/jobdragonquest-api
        run: |
          export JOBDRAGONQUEST_JWT_SECRET="$(openssl rand -base64 48)"
          jar="$(ls target/jobdragonquest-api-*.jar | grep -v plain | head -1)"
          nohup java -jar "$jar" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/actuator/health >/dev/null && exit 0; sleep 2; done
          tail -50 "$RUNNER_TEMP/api.log"; exit 1
      - name: Build e preview do painel
        working-directory: src/jobdragonquest-web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run preview > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:5173/ >/dev/null && exit 0; sleep 1; done
          tail -30 "$RUNNER_TEMP/web.log"; exit 1
      - name: Navegador do Playwright
        working-directory: src/jobdragonquest-web
        run: npx playwright install --with-deps chromium
      - name: Testes no navegador
        working-directory: src/jobdragonquest-web
        run: npm run e2e
      - name: Relatório e logs se falhar
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-relatorio
          path: |
            src/jobdragonquest-web/playwright-report/
            src/jobdragonquest-web/test-results/
            ${{ runner.temp }}/api.log
          retention-days: 14
          if-no-files-found: ignore
